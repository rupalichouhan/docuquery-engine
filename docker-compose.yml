version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docuquery-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docuquery}
      POSTGRES_USER: ${POSTGRES_USER:-docuquery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docuquery_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docuquery} -d ${POSTGRES_DB:-docuquery}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: